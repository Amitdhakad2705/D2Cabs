# Optional: a local MongoDB for development.   docker compose up -d
# Then use  MONGODB_URI=mongodb://127.0.0.1:27017/d2cabs  in backend/.env
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - d2cabs_mongo:/data/db
volumes:
  d2cabs_mongo:
